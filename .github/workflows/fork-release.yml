name: 📲 Fork Release (Android phone APK)

# Every push to develop-custom becomes a GitHub Release carrying the phone APK,
# which Obtainium on the phone watches and installs. Fork-only: upstream ships
# through release.yml (EAS), disabled on this fork.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches: [develop-custom]
  workflow_dispatch:

jobs:
  release-android-phone:
    if: ${{ github.repository == 'jclaveau/streamyfin' }}
    runs-on: ubuntu-26.04
    name: 🤖 Build and release Android APK (Phone)
    permissions:
      contents: write # create the release

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          show-progress: false

      - parallel:
          - name: 🗑️ Free Disk Space
            uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
            with:
              tool-cache: false
              mandb: true
              android: false
              dotnet: true
              haskell: true
              large-packages: false
              docker-images: true
              swap-storage: false

          - name: 🍞 Setup Bun
            uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            with:
              bun-version: "1.4.4"

          - name: ☕ Set up JDK 17
            uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
            with:
              distribution: temurin
              java-version: "17"

      - parallel:
          - name: 💾 Cache Bun dependencies
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: ~/.bun/install/cache
              key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
              restore-keys: |
                ${{ runner.os }}-${{ runner.arch }}-bun-

          - name: 💾 Cache Gradle global
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: |
                ~/.gradle/caches/modules-2
                ~/.gradle/wrapper
              key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
              restore-keys: |
                ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🛠️ Generate project files
        env:
          FORK_VERSION_CODE: ${{ github.run_number }}
        run: bun run prebuild

      - name: 🚀 Build APK
        env:
          EXPO_TV: 0
          FORK_VERSION_CODE: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: bun run build:android:local

      - name: 🏷️ Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          app_version=$(jq -r .expo.version app.json)
          tag="v${app_version}-fork.${RUN_NUMBER}"
          apk="streamyfin-fork-${app_version}-fork.${RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Streamyfin Fork ${app_version} (build ${RUN_NUMBER})" \
            --notes "Built from develop-custom at ${GITHUB_SHA}."
